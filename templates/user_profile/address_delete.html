
{% extends 'base/base.html' %}
{% load static %}

{% block page_content %}
<link rel="stylesheet" href="{% static 'css/users/address_delete.css' %}">

<section class="address-delete">

    <h1>Delete Address</h1>

    <p class="delete-warning">
        Are you sure you want to delete this delivery address?
    </p>

    <div class="delete-address-card">
        <p>{{ object.get_full_address }}</p>
        <p class="delete-phone">{{ object.phone_num }}</p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="delete-actions">

            <button type="submit" class="confirm-delete-btn">
                Delete Address
            </button>

            <a href="{% url 'account_details' %}"
               class="cancel-delete-btn">
                Cancel
            </a>

        </div>
    </form>

</section>
{% endblock %}
